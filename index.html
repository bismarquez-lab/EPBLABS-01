<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPBLAB | Gestão de Laboratórios</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Scripts de Autenticação e Firebase -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://alcdn.msauth.net/browser/2.30.0/js/msal-browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --md-sys-color-primary: #0b57d0;
            --md-sys-color-primary-container: #d3e3fd;
            --md-sys-color-surface: #f0f4f9;
            --md-sys-color-surface-variant: #ffffff;
            --md-sys-color-outline: #e3e3e3;
            --md-sys-color-text: #1f1f1f;
            --md-sys-color-text-secondary: #444746;
            --radius-lg: 24px;
            --radius-md: 12px;
            --shadow-md: 0 4px 12px rgba(0,0,0,0.04);
            --transition: all 0.2s ease;
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-text);
        }

        canvas { position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none; opacity: 0.5; }

        header {
            position: fixed; top: 0; width: 100%; height: 72px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--md-sys-color-outline);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 32px; box-sizing: border-box; z-index: 1000;
        }

        .nav-links { display: flex; gap: 8px; margin-left: 24px; }
        .nav-btn {
            background: transparent; border: none; padding: 8px 16px;
            border-radius: 100px; font-weight: 500; cursor: pointer;
            transition: var(--transition); color: var(--md-sys-color-text-secondary);
        }
        .nav-btn.active { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-primary); }

        .auth-area { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--md-sys-color-outline); }

        main { margin-top: 100px; padding: 0 32px 40px; max-width: 1400px; margin-left: auto; margin-right: auto; }

        .card {
            background: var(--md-sys-color-surface-variant);
            border-radius: var(--radius-lg); padding: 24px;
            border: 1px solid var(--md-sys-color-outline); box-shadow: var(--shadow-md);
            margin-bottom: 24px;
        }

        .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }

        /* Tabela Estilo MD3 */
        .table-container { overflow-x: auto; border-radius: var(--radius-md); border: 1px solid var(--md-sys-color-outline); }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 13px; min-width: 850px; }
        th { background: #f8f9fa; padding: 14px; border-bottom: 2px solid var(--md-sys-color-outline); }
        td { padding: 6px; border: 1px solid #f1f3f4; text-align: center; height: 65px; }
        .td-lab { background: #f8f9fa; font-weight: 600; text-align: left; padding-left: 16px; width: 140px; position: sticky; left: 0; }

        .celula-livre { color: #bdc1c6; font-style: italic; font-size: 11px; }
        .celula-ocupada {
            background: var(--md-sys-color-primary-container);
            border-radius: 8px; padding: 8px; border: 1px solid #a8c7fa;
            display: flex; flex-direction: column; justify-content: center;
        }
        .celula-ocupada strong { color: #041e49; font-size: 13px; }
        .celula-ocupada span { color: var(--md-sys-color-primary); font-size: 11px; }

        /* Inputs */
        select, input {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid var(--md-sys-color-outline); margin-bottom: 12px;
            font-family: inherit; font-size: 14px;
        }
        .btn-action {
            width: 100%; padding: 12px; background: var(--md-sys-color-primary);
            color: white; border: none; border-radius: 100px;
            font-weight: 600; cursor: pointer; transition: var(--transition);
        }
        .btn-action:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Notificação Toast */
        #toast {
            position: fixed; bottom: -60px; left: 50%; transform: translateX(-50%);
            background: #323232; color: white; padding: 12px 24px;
            border-radius: 100px; transition: bottom 0.3s ease; z-index: 2000;
        }
        #toast.show { bottom: 32px; }

        .btn-apagar { background: transparent; color: #d32f2f; border: none; font-size: 11px; cursor: pointer; margin-top: 4px; font-weight: 600; }

        .pagina { display: none; flex-direction: column; }
    </style>
</head>
<body>

    <canvas id="meuCanvas"></canvas>

    <header>
        <div style="display:flex; align-items:center;">
            <div style="font-weight: 700; font-size: 20px;">🎓 EPBLAB</div>
            <div id="menu-dinamico" class="nav-links"></div>
        </div>

        <div id="area-auth">
            <!-- Login -->
            <div id="login-box" class="auth-area">
                <div id="g_id_onload" data-client_id="212510825125-n312apg76r8sqbdkf7gcov8da25796ar.apps.googleusercontent.com" data-callback="handleCredentialResponse"></div>
                <div class="g_id_signin" data-type="standard"></div>
                <button class="nav-btn" onclick="loginMS()" style="border: 1px solid var(--md-sys-color-outline)">Microsoft</button>
            </div>
            <!-- Usuário Logado -->
            <div id="user-box" class="auth-area" style="display:none;">
                <div style="text-align: right">
                    <div id="u-nome" style="font-weight:600; font-size:14px;"></div>
                    <div id="u-cargo" style="font-size:11px; color: var(--md-sys-color-primary)"></div>
                </div>
                <img id="u-foto" class="avatar" src="">
                <button onclick="logout()" class="nav-btn">Sair</button>
            </div>
        </div>
    </header>

    <div id="toast">Mensagem</div>

    <main>
        <!-- CALENDÁRIO PÚBLICO (Sempre Visível) -->
        <section id="sec-publica" class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:15px;">
                <div>
                    <h2 style="margin:0">Agenda de Laboratórios</h2>
                    <p style="margin:5px 0 0; color:var(--md-sys-color-text-secondary); font-size:14px;">Verifique a disponibilidade em tempo real.</p>
                </div>
                <div style="display:flex; gap:10px;">
                    <select id="f-turno-pub" onchange="renderCalendarioPublico()" style="width:auto; margin:0;">
                        <option value="Manhã">Manhã</option><option value="Tarde">Tarde</option><option value="Noite">Noite</option>
                    </select>
                    <input type="date" id="f-data-pub" onchange="renderCalendarioPublico()" style="width:auto; margin:0;">
                </div>
            </div>
            <div id="grade-publica" class="table-container"></div>
        </section>

        <!-- ÁREA PRIVADA -->
        <section id="sec-privada" style="display:none;">
            
            <!-- Página de Reservas -->
            <div id="pag-reservas" class="pagina">
                <div class="grid-layout" style="grid-template-columns: 280px 1fr;">
                    <div class="card">
                        <h4 style="margin-top:0">Nova Reserva</h4>
                        <input type="date" id="res-data">
                        <select id="res-lab">
                            <option value="">Selecione o Lab...</option>
                        </select>
                        <select id="res-horario">
                            <option value="">Qual a aula?</option>
                        </select>
                        <select id="res-turma">
                            <option value="">Sua Turma...</option>
                        </select>
                        <select id="res-semanas">
                            <option value="1">Apenas hoje</option>
                            <option value="4">Mensal (4 semanas)</option>
                            <option value="20">Semestre (20 semanas)</option>
                        </select>
                        <button class="btn-action" onclick="fazerReserva()">Agendar Agora</button>
                    </div>
                    <div class="card" id="grade-privada-container">
                        <!-- Grade com botões de apagar -->
                    </div>
                </div>
            </div>

            <!-- Outras páginas (Admin, Prof, Aluno) -->
            <div id="pag-admin" class="pagina">
                <div class="grid-layout">
                    <div class="card">
                        <h4>Gestão de Professores</h4>
                        <input id="adm-prof-email" placeholder="E-mail do professor">
                        <button class="btn-action" onclick="admAddProf()">Cadastrar</button>
                        <ul id="lista-profs" style="font-size:13px; margin-top:15px; padding:0; list-style:none;"></ul>
                    </div>
                </div>
            </div>

            <div id="pag-materiais" class="pagina">
                <div class="card">
                    <h4>Compartilhar Arquivos</h4>
                    <select id="up-turma"></select>
                    <input type="file" id="up-file">
                    <button class="btn-action" onclick="execUpload()">Enviar para o Drive</button>
                </div>
            </div>

        </section>
    </main>

    <script>
        // 1. CONFIGURAÇÕES
        const firebaseConfig = {
            apiKey: "AIzaSyAz_QgvgVDx80smVoX20lJR9sfZvZEg7c0",
            authDomain: "epblabs-10353.firebaseapp.com",
            projectId: "epblabs-10353",
            storageBucket: "epblabs-10353.firebasestorage.app",
            messagingSenderId: "420618806307",
            appId: "1:420618806307:web:172055161daad338527d96"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzRnwoVxl_9ZSFNJJIHKijWFFhfqS1T7US_KGNhCI6qxfeYWsnSoRsHLOcQC5AEwdsi/exec';
        const LABS = ["Laboratório 1", "Laboratório 2", "Laboratório 3", "Laboratório 4", "Laboratório 5", "Laboratório 6", "Laboratório 7", "Sala Maker", "Laboratório 9"];
        const HORARIOS = {
            'Manhã': ["Manhã - 1ª Aula - 07:30 até 08:20", "Manhã - 2ª Aula - 08:20 até 09:10", "Manhã - 3ª Aula - 09:10 até 10:00", "Manhã - 4ª Aula - 10:20 até 11:10", "Manhã - 5ª Aula - 11:10 até 12:00", "Manhã - 6ª Aula - 12:00 até 12:50"],
            'Tarde': ["Tarde - 1ª Aula - 13:30 até 14:20", "Tarde - 2ª Aula - 14:20 até 15:10", "Tarde - 3ª Aula - 15:10 até 16:00", "Tarde - 4ª Aula - 16:20 até 17:10", "Tarde - 5ª Aula - 17:10 até 18:00", "Tarde - 6ª Aula - 18:00 até 18:50"],
            'Noite': ["Noite - 1ª Aula - 19:00 até 19:50", "Noite - 2ª Aula - 19:50 até 20:40", "Noite - 3ª Aula - 21:00 até 21:50", "Noite - 4ª Aula - 21:50 até 22:45"]
        };

        let USUARIO = null;
        let STATE = { agendamentos: [], turmas: [], role: 'aluno' };

        // 2. INICIALIZAÇÃO
        window.onload = () => {
            document.getElementById('f-data-pub').valueAsDate = new Date();
            document.getElementById('res-data').valueAsDate = new Date();
            
            // Popular selects
            let labSel = document.getElementById('res-lab');
            LABS.forEach(l => labSel.innerHTML += `<option value="${l}">${l}</option>`);
            
            let horSel = document.getElementById('res-horario');
            for(let t in HORARIOS) {
                let group = `<optgroup label="${t}">`;
                HORARIOS[t].forEach(h => group += `<option value="${h}">${h.split(' - ')[1]}</option>`);
                horSel.innerHTML += group + `</optgroup>`;
            }

            iniciarEscutas();
            
            // Auto-login se houver cache
            const salvo = localStorage.getItem('epb_user');
            if(salvo) logar(JSON.parse(salvo));
        };

        // 3. SISTEMA DE LOGIN
        function handleCredentialResponse(r) {
            const data = JSON.parse(atob(r.credential.split('.')[1]));
            logar({ email: data.email.toLowerCase(), nome: data.given_name, foto: data.picture });
        }

        async function logar(dados) {
            USUARIO = dados;
            localStorage.setItem('epb_user', JSON.stringify(dados));
            
            // Verificar Role
            const admins = ["bismarquez@gmail.com"];
            const profs = await db.collection('professores').doc(USUARIO.email).get();
            
            if(admins.includes(USUARIO.email)) STATE.role = 'admin';
            else if(profs.exists) STATE.role = 'professor';
            else STATE.role = 'aluno';

            document.getElementById('login-box').style.display = 'none';
            document.getElementById('user-box').style.display = 'flex';
            document.getElementById('u-nome').innerText = USUARIO.nome;
            document.getElementById('u-cargo').innerText = STATE.role.toUpperCase();
            document.getElementById('u-foto').src = USUARIO.foto;
            
            document.getElementById('sec-publica').style.display = 'none';
            document.getElementById('sec-privada').style.display = 'block';
            
            configurarMenu();
            showToast(`Bem-vindo, ${USUARIO.nome}!`);
        }

        function logout() {
            localStorage.removeItem('epb_user');
            location.reload();
        }

        // 4. BANCO DE DADOS (REAL-TIME)
        function iniciarEscutas() {
            db.collection('agendamentos').onSnapshot(snap => {
                STATE.agendamentos = snap.docs.map(d => ({id: d.id, ...d.data()}));
                renderCalendarioPublico();
                renderCalendarioPrivado();
            });

            db.collection('turmas').onSnapshot(snap => {
                STATE.turmas = snap.docs.map(d => ({id: d.id, ...d.data()}));
                atualizarSelectTurmas();
            });
        }

        // 5. RENDERIZAÇÃO DE TABELAS
        function gerarTabelaHTML(dataAlvo, turnoAlvo, isAdminView = false) {
            const horarios = HORARIOS[turnoAlvo];
            let html = `<table><thead><tr><th class="td-lab">Sala</th>`;
            horarios.forEach(h => html += `<th>${h.split(' - ')[1]}<br><small style="font-weight:400">${h.split(' - ')[2]}</small></th>`);
            html += `</tr></thead><tbody>`;

            LABS.forEach(lab => {
                html += `<tr><td class="td-lab">${lab}</td>`;
                horarios.forEach(h => {
                    const res = STATE.agendamentos.find(a => a.data === dataAlvo && a.lab === lab && a.horario === h);
                    if(res) {
                        const dono = res.prof === USUARIO?.email || STATE.role === 'admin';
                        html += `<td><div class="celula-ocupada">
                            <strong>${res.turma}</strong>
                            <span>${res.prof.split('@')[0]}</span>
                            ${(isAdminView && dono) ? `<button class="btn-apagar" onclick="excluirReserva('${res.id}')">Excluir</button>` : ''}
                        </div></td>`;
                    } else {
                        html += `<td class="celula-livre">Livre</td>`;
                    }
                });
                html += `</tr>`;
            });
            return html + `</tbody></table>`;
        }

        function renderCalendarioPublico() {
            const d = document.getElementById('f-data-pub').value;
            const t = document.getElementById('f-turno-pub').value;
            document.getElementById('grade-publica').innerHTML = gerarTabelaHTML(d, t, false);
        }

        function renderCalendarioPrivado() {
            const d = document.getElementById('res-data').value;
            const t = "Manhã"; // Exemplo, pode ser dinâmico
            document.getElementById('grade-privada-container').innerHTML = gerarTabelaHTML(d, 'Manhã', true) + gerarTabelaHTML(d, 'Tarde', true) + gerarTabelaHTML(d, 'Noite', true);
        }

        // 6. AÇÕES
        async function fazerReserva() {
            const data = document.getElementById('res-data').value;
            const lab = document.getElementById('res-lab').value;
            const hor = document.getElementById('res-horario').value;
            const tur = document.getElementById('res-turma').value;
            const sem = parseInt(document.getElementById('res-semanas').value);

            if(!data || !lab || !hor || !tur) return showToast("Preencha tudo!", "erro");

            showToast("Verificando disponibilidade...", "processando");

            // Lógica de Série
            const batch = db.batch();
            const dataBase = new Date(data + "T12:00:00");
            
            for(let i=0; i<sem; i++) {
                const dNova = new Date(dataBase);
                dNova.setDate(dataBase.getDate() + (i*7));
                const dataString = dNova.toISOString().split('T')[0];

                // Check conflito local
                if(STATE.agendamentos.find(a => a.data === dataString && a.lab === lab && a.horario === hor)) {
                    return showToast(`Conflito em ${dataString}`, "erro");
                }

                const ref = db.collection('agendamentos').doc();
                batch.set(ref, { data: dataString, lab, horario: hor, turma: tur, prof: USUARIO.email, created: new Date() });
            }

            await batch.commit();
            showToast("Reserva confirmada!");
        }

        async function excluirReserva(id) {
            if(confirm("Deseja cancelar esta reserva?")) {
                await db.collection('agendamentos').doc(id).delete();
                showToast("Cancelado.");
            }
        }

        // 7. ARQUIVOS (BRIDGE GAS)
        async function execUpload() {
            const fileInput = document.getElementById('up-file');
            const turma = document.getElementById('up-turma').value;
            if(!fileInput.files[0] || !turma) return showToast("Selecione arquivo e turma");

            showToast("Enviando para o Drive...", "processando");
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64 = e.target.result.split(',')[1];
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: STATE.role === 'professor' ? 'upload_professor' : 'upload_aluno',
                        fileName: file.name,
                        mimeType: file.type,
                        base64: base64,
                        turmaAlvo: turma,
                        userEmail: USUARIO.email
                    })
                });
                const final = await res.json();
                if(final.status === 'sucesso') {
                    showToast("Arquivo salvo com sucesso!");
                }
            };
            reader.readAsDataURL(file);
        }

        // HELPERS
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function configurarMenu() {
            const m = document.getElementById('menu-dinamico');
            m.innerHTML = `<button class="nav-btn active" onclick="abrirPag('pag-reservas', this)">Reservas</button>`;
            if(STATE.role !== 'aluno') m.innerHTML += `<button class="nav-btn" onclick="abrirPag('pag-materiais', this)">Materiais</button>`;
            if(STATE.role === 'admin') m.innerHTML += `<button class="nav-btn" onclick="abrirPag('pag-admin', this)">Admin</button>`;
        }

        function abrirPag(id, btn) {
            document.querySelectorAll('.pagina').forEach(p => p.style.display = 'none');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).style.display = 'flex';
            btn.classList.add('active');
        }

        function atualizarSelectTurmas() {
            const s1 = document.getElementById('res-turma');
            const s2 = document.getElementById('up-turma');
            let h = `<option value="">Escolha...</option>`;
            STATE.turmas.forEach(t => h += `<option value="${t.id}">${t.id}</option>`);
            if(s1) s1.innerHTML = h;
            if(s2) s2.innerHTML = h;
        }

        // Animação Fundo
        const cv = document.getElementById('meuCanvas');
        const cx = cv.getContext('2d');
        cv.width = window.innerWidth; cv.height = window.innerHeight;
        let pts = Array(30).fill().map(() => ({x: Math.random()*cv.width, y: Math.random()*cv.height, vx: Math.random()-0.5, vy: Math.random()-0.5}));
        function anim() {
            cx.clearRect(0,0,cv.width,cv.height);
            cx.fillStyle = "#0b57d0";
            pts.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if(p.x<0 || p.x>cv.width) p.vx *= -1;
                if(p.y<0 || p.y>cv.height) p.vy *= -1;
                cx.beginPath(); cx.arc(p.x, p.y, 2, 0, Math.PI*2); cx.fill();
            });
            requestAnimationFrame(anim);
        }
        anim();

    </script>
</body>
</html>
