<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Game Clone</title>
    <style>
        /* Reset de margens e centralização da tela */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f4f8;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; /* Evita rolagem da tela no celular */
        }

        /* Área do Jogo */
        #game-board {
            width: 600px;
            height: 200px;
            background-color: #fff;
            border-bottom: 3px solid #333;
            position: relative;
            overflow: hidden;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.1);
            border-radius: 8px 8px 0 0;
        }

        /* O "Dinossauro" (Bloco Escuro) */
        #dino {
            width: 40px;
            height: 40px;
            background-color: #333;
            position: absolute;
            bottom: 0;
            left: 50px;
            border-radius: 6px;
        }

        /* Animação de Pulo */
        .jump {
            animation: jump-anim 0.5s linear;
        }

        @keyframes jump-anim {
            0% { bottom: 0; }
            40% { bottom: 120px; }
            50% { bottom: 130px; }
            60% { bottom: 120px; }
            100% { bottom: 0; }
        }

        /* O "Cacto" (Bloco Vermelho) */
        #cactus {
            width: 20px;
            height: 40px;
            background-color: #e74c3c;
            position: absolute;
            bottom: 0;
            right: -20px;
            border-radius: 4px 4px 0 0;
            animation: block-anim 1.5s infinite linear;
        }

        /* Animação do obstáculo vindo da direita para a esquerda */
        @keyframes block-anim {
            0% { right: -20px; }
            100% { right: 620px; }
        }
