<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Interativo - Upload</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        /* --- ESTILOS GERAIS --- */
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Esconde a barra de rolagem */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0c10;
        }

        /* O Canvas (Fundo Animado) */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1; /* Fica no fundo */
        }

        /* --- PAINEL CENTRAL (UI) --- */
        #painel-central {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10; /* Fica por cima do canvas */
            
            /* Efeito "Glassmorphism" (Vidro) */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 40px;
            width: 350px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Seção de Login */
        #secao-login h2 { margin-top: 0; font-size: 24px; font-weight: 400; }
        #secao-login p { font-size: 14px; color: #ddd; margin-bottom: 25px; }
        
        /* Contêiner para centralizar o botão do Google */
        .google-btn-container { display: flex; justify-content: center; }

        /* Seção do Usuário logado e Upload (Escondida no início) */
        #secao-dashboard { display: none; }
        
        #foto-perfil {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #00ff99;
            margin-bottom: 15px;
        }
        
        #nome-usuario { margin: 0 0 5px 0; font-size: 22px; }
        #email-usuario { margin: 0 0 25px 0; font-size: 14px; color: #aaa; }

        /* Estilos do Upload */
        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #00ff99, #00ccff);
            color: #0b0c10;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 153, 0.4);
        }

        button:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #mensagem-status { margin-top: 15px; font-size: 14px; min-height: 20px;}
    </style>
</head>
<body>

    <canvas id="meuCanvas"></canvas>

    <div id="g_id_onload"
         data-client_id="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.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="lidarComRespostaDoGoogle"
         data-auto_prompt="false">
    </div>

    <div id="painel-central">
        
        <div id="secao-login">
            <h2>Bem-vindo</h2>
            <p>Faça login para acessar o sistema de envio de arquivos.</p>
            <div class="google-btn-container">
                <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="filled_black" data-text="signin_with" data-size="large"></div>
            </div>
        </div>

        <div id="secao-dashboard">
            <img id="foto-perfil" src="" alt="Sua foto">
            <h3 id="nome-usuario">Nome</h3>
            <p id="email-usuario">email@gmail.com</p>

            <input type="file" id="arquivo-input">
            <button id="btn-enviar" onclick="enviarArquivo()">Enviar para o Drive</button>
            <div id="mensagem-status"></div>
        </div>

    </div>

    <script>
        // ==========================================
        // CONFIGURAÇÕES DO SISTEMA (PREENCHA AQUI)
        // ==========================================
        // ⚠️ ATENÇÃO: COLOQUE O LINK GIGANTE DO SEU SCRIPT DO DRIVE AQUI
        const URL_DO_SCRIPT = 'https://script.google.com/macros/s/AKfycbzRnwoVxl_9ZSFNJJIHKijWFFhfqS1T7US_KGNhCI6qxfeYWsnSoRsHLOcQC5AEwdsi/exec';


        // ==========================================
        // LÓGICA DE LOGIN (GOOGLE)
        // ==========================================
        function decodificarJwt(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function lidarComRespostaDoGoogle(response) {
            const dadosUsuario = decodificarJwt(response.credential);
            
            // Preenche os dados na tela
            document.getElementById('nome-usuario').innerText = "Olá, " + dadosUsuario.given_name;
            document.getElementById('email-usuario').innerText = dadosUsuario.email;
            document.getElementById('foto-perfil').src = dadosUsuario.picture;
            
            // Troca as telas
            document.getElementById('secao-login').style.display = 'none';
            document.getElementById('secao-dashboard').style.display = 'block';
        }


        // ==========================================
        // LÓGICA DE UPLOAD (DRIVE)
        // ==========================================
        function enviarArquivo() {
            const input = document.getElementById('arquivo-input');
            const statusTexto = document.getElementById('mensagem-status');
            const botao = document.getElementById('btn-enviar');

            if (input.files.length === 0) {
                statusTexto.innerText = "⚠️ Selecione um arquivo.";
                statusTexto.style.color = "#ffcc00";
                return;
            }

            const arquivo = input.files[0];
            const leitor = new FileReader();

            botao.innerText = "Enviando... Aguarde";
            botao.disabled = true;
            statusTexto.innerText = "Preparando arquivo...";
            statusTexto.style.color = "#00ccff";

            leitor.onload = async function(evento) {
                const base64 = evento.target.result.split(',')[1];
                
                const dadosParaEnviar = {
                    fileName: arquivo.name,
                    mimeType: arquivo.type,
                    base64: base64
                };

                statusTexto.innerText = "Enviando para o Google Drive...";

                try {
                    const resposta = await fetch(URL_DO_SCRIPT, {
                        method: 'POST',
                        body: JSON.stringify(dadosParaEnviar),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' } 
                    });

                    const resultado = await resposta.json();

                    if (resultado.status === "sucesso") {
                        statusTexto.innerText = "✅ Arquivo enviado com sucesso!";
                        statusTexto.style.color = "#00ff99";
                    } else {
                        statusTexto.innerText = "❌ Erro: " + resultado.mensagem;
                        statusTexto.style.color = "#ff0055";
                    }
                } catch (erro) {
                    statusTexto.innerText = "❌ Erro de conexão. Tente novamente.";
                    statusTexto.style.color = "#ff0055";
                    console.error(erro);
                }

                botao.innerText = "Enviar outro arquivo";
                botao.disabled = false;
                input.value = ''; 
            };

            leitor.readAsDataURL(arquivo);
        }


        // ==========================================
        // LÓGICA DO FUNDO ANIMADO (CANVAS)
        // ==========================================
        const canvas = document.getElementById('meuCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];
        const cores = ['#ff0055', '#00ff99', '#00ccff', '#ffcc00', '#aa00ff'];
        let hueFundo = 0;
        let mouse = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', (e) => { mouse.x =
