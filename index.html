<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal da Turma</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0c10; color: white;}
        canvas { display: block; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        #painel-central {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10;
            background: rgba(20, 20, 25, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 30px; 
            width: 400px; max-height: 85vh; overflow-y: auto; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: border-color 0.4s;
        }
        
        #painel-central::-webkit-scrollbar { width: 6px; }
        #painel-central::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        /* Estilos de Perfil e Logout */
        .cabecalho-perfil { position: relative; margin-bottom: 15px; }
        #btn-sair { position: absolute; top: 0; right: 0; background: rgba(255,0,85,0.2); color: #ff0055; border: 1px solid #ff0055; padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; transition: 0.2s; font-weight: bold;}
        #btn-sair:hover { background: #ff0055; color: white; }

        #foto-perfil { width: 70px; height: 70px; border-radius: 50%; margin-bottom: 5px; border: 3px solid #555; transition: border-color 0.3s;}
        #nome-usuario { margin: 0; font-size: 22px; }
        #badge-funcao { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; letter-spacing: 1px;}
        
        /* Cores Temáticas */
        .tema-aluno { border-color: rgba(0, 255, 153, 0.3) !important; }
        .tema-aluno #foto-perfil { border-color: #00ff99; }
        .tema-aluno #badge-funcao { background: #00ff99; color: #0b0c10; }
        
        .tema-prof { border-color: rgba(255, 204, 0, 0.3) !important; }
        .tema-prof #foto-perfil { border-color: #ffcc00; }
        .tema-prof #badge-funcao { background: #ffcc00; color: #0b0c10; }

        /* Inputs e Botões */
        input[type="file"] { width: 100%; padding: 8px; margin-bottom: 10px; background: rgba(0,0,0,0.4); border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); box-sizing: border-box; font-size: 13px;}
        button { width: 100%; padding: 10px; color: #0b0c10; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:disabled { background: #555 !important; color: #888; cursor: not-allowed; }
        
        .btn-aluno { background: linear-gradient(45deg, #00ff99, #00ccff); }
        .btn-aluno:hover { box-shadow: 0 0 15px rgba(0, 255, 153, 0.4); }
        .btn-prof { background: linear-gradient(45deg, #ffcc00, #ff6600); }
        .btn-prof:hover { box-shadow: 0 0 15px rgba(255, 204, 0, 0.4); }

        /* Áreas de Listagem */
        .box-arquivos { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; text-align: left; margin-top: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .box-arquivos h4 { margin: 0 0 10px 0; font-size: 13px; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        .box-arquivos ul { list-style: none; padding: 0; margin: 0; font-size: 12px; }
        .box-arquivos li { margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px dashed rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center;}
        .box-arquivos a { color: #fff; text-decoration: none; word-break: break-all; margin-right: 10px;}
        .box-arquivos a:hover { text-decoration: underline; color: #00ccff;}
        
        /* Lista Específica da Visão Geral (Aninhada) */
        .li-visao-geral { flex-direction: column !important; align-items: flex-start !important; background: rgba(0,0,0,0.4); border-radius: 6px; padding: 10px !important; margin-bottom: 10px !important; border: 1px solid rgba(255,255,255,0.05) !important;}
        .ul-interna { width: 100%; margin-top: 8px !important; padding-left: 5px !important; }
        .ul-interna li { border: none; padding: 0; margin-bottom: 5px; }

        .btn-apagar { background: #ff0055; color: white; border: none; border-radius: 4px; padding: 3px 6px; font-size: 10px; cursor: pointer; width: auto;}
        
        #secao-dashboard { display: none; }
        .google-btn-container { display: flex; justify-content: center; margin-top: 20px;}
    </style>
</head>
<body>

    <canvas id="meuCanvas"></canvas>

    <div id="g_id_onload"
         data-client_id="212510825125-n312apg76r8sqbdkf7gcov8da25796ar.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="lidarComRespostaDoGoogle"
         data-auto_prompt="false">
    </div>

    <div id="painel-central">
        
        <div id="secao-login">
            <h2>Portal da Turma</h2>
            <p>Faça login para continuar.</p>
            <div class="google-btn-container">
                <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="filled_black" data-text="signin_with" data-size="large"></div>
            </div>
        </div>

        <div id="secao-dashboard">
            <div class="cabecalho-perfil">
                <button id="btn-sair" onclick="fazerLogout()">Sair da Conta</button>
                <img id="foto-perfil" src="" alt="Sua foto">
                <h3 id="nome-usuario">Nome</h3>
                <span id="badge-funcao">Carregando...</span>
                <span id="email-oculto" style="display:none;"></span>
            </div>

            <div id="view-professor" style="display: none;">
                <div class="box-arquivos" style="background: rgba(255, 204, 0, 0.1);">
                    <h4 style="color: #ffcc00;">📤 Compartilhar Material</h4>
                    <input type="file" id="input-prof">
                    <button class="btn-prof" id="btn-enviar-prof" onclick="enviarArquivo('professor')">Enviar para a Turma</button>
                    <div id="status-prof" style="font-size: 12px; margin-top: 5px;"></div>
                </div>

                <div class="box-arquivos">
                    <h4 style="color: #ffcc00;">📚 Materiais Ativos</h4>
                    <ul id="lista-materiais-prof"></ul>
                </div>

                <div class="box-arquivos" style="border: 1px solid rgba(0, 204, 255, 0.3);">
                    <h4 style="color: #00ccff;">👁️ Entregas dos Alunos</h4>
                    <ul id="lista-visao-geral"></ul>
                </div>
            </div>

            <div id="view-aluno" style="display: none;">
                <div class="box-arquivos">
                    <h4 style="color: #00ccff;">📚 Materiais da Turma</h4>
                    <ul id="lista-materiais-aluno"></ul>
                </div>

                <div class="box-arquivos" style="background: rgba(0, 255, 153, 0.1);">
                    <h4 style="color: #00ff99;">📤 Entregar Atividade</h4>
                    <input type="file" id="input-aluno">
                    <button class="btn-aluno" id="btn-enviar-aluno" onclick="enviarArquivo('aluno')">Enviar Trabalho</button>
                    <div id="status-aluno" style="font-size: 12px; margin-top: 5px;"></div>
                </div>

                <div class="box-arquivos">
                    <h4 style="color: #00ff99;">📂 Meus Envios</h4>
                    <ul id="lista-meus-envios"></ul>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURAÇÕES
        // ==========================================
        const URL_DO_SCRIPT = 'https://script.google.com/macros/s/AKfycbzRnwoVxl_9ZSFNJJIHKijWFFhfqS1T7US_KGNhCI6qxfeYWsnSoRsHLOcQC5AEwdsi/exec';
        const PROFESSORES = ["bismarquez@gmail.com"]; 
        let roleAtual = "aluno"; 

        // ==========================================
        // 1. LOGIN, LOGOUT E ROTEAMENTO
        // ==========================================
        function decodificarJwt(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
        }

        function lidarComRespostaDoGoogle(response) {
            const dados = decodificarJwt(response.credential);
            const email = dados.email;
            
            document.getElementById('nome-usuario').innerText = dados.given_name;
            document.getElementById('email-oculto').innerText = email;
            document.getElementById('foto-perfil').src = dados.picture;
            
            const painel = document.getElementById('painel-central');
            painel.classList.remove("tema-prof", "tema-aluno"); // Limpa temas antigos

            if (PROFESSORES.includes(email)) {
                roleAtual = "professor";
                painel.classList.add("tema-prof");
                document.getElementById('badge-funcao').innerText = "PROFESSOR";
                document.getElementById('view-professor').style.display = "block";
                document.getElementById('view-aluno').style.display = "none";
            } else {
                roleAtual = "aluno";
                painel.classList.add("tema-aluno");
                document.getElementById('badge-funcao').innerText = "ALUNO";
                document.getElementById('view-aluno').style.display = "block";
                document.getElementById('view-professor').style.display = "none";
            }
            
            document.getElementById('secao-login').style.display = 'none';
            document.getElementById('secao-dashboard').style.display = 'block';

            atualizarListas(email);
        }

        function fazerLogout() {
            // Desativa o auto-login do Google temporariamente
            google.accounts.id.disableAutoSelect();
            
            // Esconde o dashboard e mostra o login novamente
            document.getElementById('secao-dashboard').style.display = 'none';
            document.getElementById('secao-login').style.display = 'block';
            
            // Limpa o painel
            document.getElementById('painel-central').classList.remove("tema-prof", "tema-aluno");
        }

        // ==========================================
        // 2. BUSCAR ARQUIVOS DA NUVEM
        // ==========================================
        async function atualizarListas(email) {
            // Mensagens de carregamento
            document.getElementById('lista-materiais-prof').innerHTML = '<li>Carregando...</li>';
            document.getElementById('lista-materiais-aluno').innerHTML = '<li>Carregando...</li>';
            document.getElementById('lista-visao-geral').innerHTML = '<li>Carregando entregas...</li>';
            document.getElementById('lista-meus-envios').innerHTML = '<li>Carregando...</li>';

            try {
                const resposta = await fetch(`${URL_DO_SCRIPT}?email=${encodeURIComponent(email)}`);
                const resultado = await resposta.json();

                if (resultado.status === "sucesso") {
                    
                    // Renderiza lista de materiais compartilhados
                    let htmlMateriaisProf = '';
                    let htmlMateriaisAluno = '';
                    
                    if(resultado.arquivosProfessor.length === 0){
                        htmlMateriaisProf = '<li style="color:#aaa;">Nenhum material compartilhado.</li>';
                        htmlMateriaisAluno = '<li style="color:#aaa;">Nenhum material disponível ainda.</li>';
                    } else {
                        resultado.arquivosProfessor.forEach(arq => {
                            let docLink = `📄 <a href="${arq.link}" target="_blank">${arq.nome}</a>`;
                            htmlMateriaisProf += `<li>${docLink} <button class="btn-apagar" onclick="apagarArquivo('${arq.id}', 'professor')">Apagar</button></li>`;
                            htmlMateriaisAluno += `<li>${docLink}</li>`; 
                        });
                    }
                    document.getElementById('lista-materiais-prof').innerHTML = htmlMateriaisProf;
                    document.getElementById('lista-materiais-aluno').innerHTML = htmlMateriaisAluno;

                    // Renderiza Visão Geral (Apenas para Professor)
                    if (roleAtual === "professor" && resultado.visaoGeral) {
                        let htmlVisao = '';
                        if (resultado.visaoGeral.length === 0) {
                            htmlVisao = '<li style="color:#aaa;">Nenhuma entrega ainda.</li>';
                        } else {
                            resultado.visaoGeral.forEach(aluno => {
                                htmlVisao += `<li class="li-visao-geral">
                                    <strong style="color: #00ff99; font-size: 13px;">👤 ${aluno.aluno}</strong>
                                    <ul class="ul-interna">`;
                                aluno.arquivos.forEach(arq => {
                                    htmlVisao += `<li>📄 <a href="${arq.link}" target="_blank">${arq.nome}</a> <span style="color:#aaa; font-size:10px;">(${arq.data})</span></li>`;
                                });
                                htmlVisao += `</ul></li>`;
                            });
                        }
                        document.getElementById('lista-visao-geral').innerHTML = htmlVisao;
                    }

                    // Renderiza Envios do Aluno (Apenas para Aluno)
                    if (roleAtual === "aluno") {
                        let htmlMeus = '';
                        if(resultado.arquivosAluno.length === 0){
                            htmlMeus = '<li style="color:#aaa;">Você ainda não enviou nada.</li>';
                        } else {
                            resultado.arquivosAluno.forEach(arq => {
                                htmlMeus += `<li>📄 <a href="${arq.link}" target="_blank">${arq.nome}</a> <button class="btn-apagar" onclick="apagarArquivo('${arq.id}', 'aluno')">Apagar</button></li>`;
                            });
                        }
                        document.getElementById('lista-meus-envios').innerHTML = htmlMeus;
                    }

                }
            } catch (erro) {
                console.error("Erro ao buscar arquivos", erro);
            }
        }

        // ==========================================
        // 3. ENVIAR E APAGAR ARQUIVOS
        // ==========================================
        function enviarArquivo(tipo) {
            const input = document.getElementById(tipo === 'professor' ? 'input-prof' : 'input-aluno');
            const btn = document.getElementById(tipo === 'professor' ? 'btn-enviar-prof' : 'btn-enviar-aluno');
            const status = document.getElementById(tipo === 'professor' ? 'status-prof' : 'status-aluno');
            
            if (input.files.length === 0) { status.innerText = "⚠️ Escolha um arquivo!"; return; }

            const arquivo = input.files[0];
            const leitor = new FileReader();
            
            btn.disabled = true; btn.innerText = "Enviando..."; status.innerText = "";

            leitor.onload = async function(evento) {
                const base64 = evento.target.result.split(',')[1];
                const emailLogado = document.getElementById('email-oculto').innerText;
                
                const payload = {
                    action: tipo === 'professor' ? 'upload_professor' : 'upload_aluno',
                    fileName: arquivo.name, mimeType: arquivo.type, base64: base64, userEmail: emailLogado 
                };

                try {
                    const resposta = await fetch(URL_DO_SCRIPT, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' }});
                    await resposta.json();
                    status.innerText = "✅ Sucesso!";
                    status.style.color = "#00ff99";
                    atualizarListas(emailLogado);
                } catch(e) { status.innerText = "❌ Erro ao enviar."; status.style.color = "red";}
                
                btn.disabled = false; btn.innerText = tipo === 'professor' ? "Enviar para a Turma" : "Entregar Trabalho"; input.value = '';
            };
            leitor.readAsDataURL(arquivo);
        }

        async function apagarArquivo(id, tipo) {
            if (!confirm("Apagar este arquivo?")) return;
            const emailLogado = document.getElementById('email-oculto').innerText;
            
            const payload = { action: tipo === 'professor' ? 'delete_professor' : 'delete_aluno', fileId: id, userEmail: emailLogado };

            try {
                await fetch(URL_DO_SCRIPT, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' }});
                atualizarListas(emailLogado);
            } catch(e) { alert("Erro ao apagar arquivo."); }
        }

        // ==========================================
        // CANVAS (FUNDO)
        // ==========================================
        const canvas = document.getElementById('meuCanvas'); const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particlesArray = []; const cores = ['#ff0055', '#00ff99', '#00ccff', '#ffcc00', '#aa00ff'];
        let hueFundo = 0; let mouse = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', e => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; initCanvas(); });

        class Particle {
            constructor(x, y, dx, dy, tam, cor) { this.x = x; this.y = y; this.dx = dx; this.dy = dy; this.tam = tam; this.cor = cor; }
            desenhar() { ctx.beginPath(); ctx.arc(this.x, this.y, this.tam, 0, Math.PI * 2); ctx.fillStyle = this.cor; ctx.fill(); }
            atualizar() {
                if (this.x > canvas.width || this.x < 0) this.dx = -this.dx; if (this.y > canvas.height || this.y < 0) this.dy = -this.dy;
                let distX = mouse.x - this.x; let distY = mouse.y - this.y; let dist = Math.sqrt(distX * distX + distY * distY);
                if (dist < mouse.radius) { this.x -= (distX / dist) * 3; this.y -= (distY / dist) * 3; } 
                else { this.x += this.dx; this.y += this.dy; }
                this.desenhar();
            }
        }
        function initCanvas() {
            particlesArray = []; let num = (canvas.height * canvas.width) / 9000;
            for (let i = 0; i < num; i++) particlesArray.push(new Particle(Math.random() * innerWidth, Math.random() * innerHeight, (Math.random()*1.5)-0.75, (Math.random()*1.5)-0.75, Math.random()*2+1, cores[Math.floor(Math.random()*cores.length)]));
        }
        function animar() {
            requestAnimationFrame(animar); ctx.clearRect(0, 0, innerWidth, innerHeight);
            hueFundo += 0.05; document.body.style.backgroundColor = `hsl(${hueFundo}, 40%, 8%)`;
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].atualizar();
                for (let j = i; j < particlesArray.length; j++) {
                    let d = ((particlesArray[i].x - particlesArray[j].x)**2) + ((particlesArray[i].y - particlesArray[j].y)**2);
                    if (d < 12000) { ctx.strokeStyle = `rgba(255, 255, 255, ${(1 - d/12000)*0.2})`; ctx.beginPath(); ctx.moveTo(particlesArray[i].x, particlesArray[i].y); ctx.lineTo(particlesArray[j].x, particlesArray[j].y); ctx.stroke(); }
                }
            }
        }
        initCanvas(); animar();
    </script>
</body>
</html>
