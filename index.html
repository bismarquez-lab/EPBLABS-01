<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teia Magnética Interativa</title>
    <style>
        /* Removemos as margens e escondemos a barra de rolagem */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b0c10; /* Fundo super escuro para destacar o neon */
            font-family: sans-serif;
        }

        /* O Canvas ocupa a tela inteira */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* Título discreto por cima da animação */
        #texto-fundo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.1);
            font-size: 3rem;
            font-weight: bold;
            pointer-events: none; /* Deixa o mouse "atravessar" o texto */
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="texto-fundo">Passe o mouse (ou o dedo)</div>
    <canvas id="meuCanvas"></canvas>

    <script>
        const canvas = document.getElementById('meuCanvas');
        const ctx = canvas.getContext('2d');

        // Ajusta o tamanho para a tela atual
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];
        // Paleta de cores vibrantes (Cyberpunk / Neon)
        const cores = ['#ff0055', '#00ff99', '#00ccff', '#ffcc00', '#aa00ff'];

        // Posição do Mouse/Toque
        let mouse = {
            x: null,
            y: null,
            radius: 120 // Área de repulsão do mouse
        }

        // --- CONTROLES DE INTERAÇÃO ---
        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        // Suporte para celular (Touch)
        window.addEventListener('touchmove', function(event) {
            mouse.x = event.touches[0].clientX;
            mouse.y = event.touches[0].clientY;
        });

        // Quando o mouse sai da tela, para de empurrar
        window.addEventListener('mouseout', function() {
            mouse.x = undefined;
            mouse.y = undefined;
        });

        // Reajusta tudo se o usuário girar o celular ou redimensionar a janela
        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });

        // --- CLASSE DA PARTÍCULA ---
        class Particle {
            constructor(x, y, direcaoX, direcaoY, tamanho, cor) {
                this.x = x;
                this.y = y;
                this.direcaoX = direcaoX;
                this.direcaoY = direcaoY;
                this.tamanho = tamanho;
                this.cor = cor;
            }

            // Desenha a bolinha na tela
            desenhar() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.tamanho, 0, Math.PI * 2, false);
                ctx.fillStyle = this.cor;
                ctx.fill();
            }

            // Calcula a física de movimento e a interação com o mouse
            atualizar() {
                // Checa se a partícula bateu na borda da tela e inverte a direção
                if (this.x > canvas.width || this.x < 0) this.direcaoX = -this.direcaoX;
                if (this.y > canvas.height || this.y < 0) this.direcaoY = -this.direcaoY;

                // Lógica do Ímã (Repulsão do Mouse)
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distancia = Math.sqrt(dx * dx + dy * dy);
                
                if (distancia < mouse.radius) {
                    const forcaX = dx / distancia;
                    const forcaY = dy / distancia;
                    const forcaMaxima = (mouse.radius - distancia) / mouse.radius;
                    // Multiplicador (7) define a força do "empurrão"
                    const direcaoForcaX = forcaX * forcaMaxima * 7;
                    const direcaoForcaY = forcaY * forcaMaxima * 7;

                    this.x -= direcaoForcaX;
                    this.y -= direcaoForcaY;
                } else {
                    // Movimento natural de flutuação se o mouse estiver longe
                    this.x += this.direcaoX;
                    this.y += this.direcaoY;
                }

                this.desenhar();
            }
        }

        // --- INICIALIZAÇÃO ---
        function init() {
            particlesArray = [];
            // Calcula a quantidade de bolinhas baseada no tamanho da tela (para não travar)
            let numeroDeParticulas = (canvas.height * canvas.width) / 8000;
            
            for (let i = 0; i < numeroDeParticulas; i++) {
                let tamanho = (Math.random() * 3) + 1; // Tamanho entre 1 e 4
                let x = (Math.random() * ((innerWidth - tamanho * 2) - (tamanho * 2)) + tamanho * 2);
                let y = (Math.random() * ((innerHeight - tamanho * 2) - (tamanho * 2)) + tamanho * 2);
                // Velocidade de flutuação
                let direcaoX = (Math.random() * 2) - 1;
                let direcaoY = (Math.random() * 2) - 1;
                // Sorteia uma cor da paleta
                let cor = cores[Math.floor(Math.random() * cores.length)];
                
                particlesArray.push(new Particle(x, y, direcaoX, direcaoY, tamanho, cor));
            }
        }

        // --- CONEXÃO COM LINHAS ---
        function conectar() {
            let opacidade = 1;
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    // Calcula a distância entre duas partículas
                    let distancia = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x))
                                  + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    
                    // Se estiverem perto o suficiente (valor 10000), desenha a linha
                    if (distancia < 10000) {
                        opacidade = 1 - (distancia / 10000);
                        // A linha herda a cor da partícula 'a', com opacidade dinâmica
                        ctx.strokeStyle = particlesArray[a].cor.replace(')', `, ${opacidade})`).replace('rgb', 'rgba');
                        
                        // Fallback de segurança se a cor for HEX em vez de RGB
                        ctx.strokeStyle = `rgba(255, 255, 255, ${opacidade * 0.3})`; 
                        
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        // --- LOOP DE ANIMAÇÃO (Motor do Jogo/Canvas) ---
        function animar() {
            requestAnimationFrame(animar);
            // Limpa a tela a cada frame para desenhar o próximo movimento
            ctx.clearRect(0, 0, innerWidth, innerHeight);
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].atualizar();
            }
            conectar();
        }

        init();
        animar();
    </script>
</body>
</html>
