<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login com Google</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f2f5;
        }
        #perfil-usuario {
            display: none;
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        #perfil-usuario img {
            border-radius: 50%;
            width: 80px;
        }
    </style>
</head>
<body>

    <h2>Entre na sua conta</h2>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <div id="g_id_onload"
         data-client_id="SEU_CLIENT_ID_AQUI.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="lidarComRespostaDoGoogle"
         data-auto_prompt="false">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-shape="rectangular"
         data-theme="outline"
         data-text="signin_with"
         data-size="large"
         data-logo_alignment="left">
    </div>

    <div id="perfil-usuario">
        <img id="foto" src="" alt="Foto de Perfil">
        <h3 id="nome"></h3>
        <p id="email"></p>
    </div>

    <script>
        // Função para decodificar o token de segurança que o Google envia
        function decodificarJwt(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // Função que é chamada automaticamente quando o usuário faz login com sucesso
        function lidarComRespostaDoGoogle(response) {
            // Decodifica a resposta do Google para pegar os dados do usuário
            const dadosUsuario = decodificarJwt(response.credential);

            console.log("Login feito com sucesso!");
            console.log(dadosUsuario);

            // Esconde o botão do Google
            document.querySelector('.g_id_signin').style.display = 'none';

            // Preenche os dados do usuário na tela
            document.getElementById('nome').innerText = "Olá, " + dadosUsuario.name;
            document.getElementById('email').innerText = dadosUsuario.email;
            document.getElementById('foto').src = dadosUsuario.picture;
            
            // Mostra o perfil na tela
            document.getElementById('perfil-usuario').style.display = 'block';
            
            // Aqui você poderia salvar o e-mail no seu banco de dados ou liberar o jogo!
        }
    </script>

</body>
</html>
