<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrida do Aluno - Fugindo do EPB</title>
    <style>
        /* Reset e Centralização */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Área Principal do Jogo */
        #game-board {
            width: 700px;
            height: 250px;
            background-color: white;
            border-bottom: 4px solid #34495e;
            position: relative;
            overflow: hidden;
            box-shadow: 0px 15px 30px rgba(0,0,0,0.1);
            border-radius: 10px 10px 0 0;
        }

        /* O Aluno (Substituindo o Dino) */
        #player {
            width: 35px;
            height: 60px; /* Mais alto, forma humana */
            background-color: #f39c12; /* Amarelo-alaranjado */
            position: absolute;
            bottom: 0;
            left: 60px;
            border-radius: 8px 8px 2px 2px;
            z-index: 2;
        }

        /* Animação de Pulo do Aluno */
        .jump {
            animation: jump-anim 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94); /* Curva mais suave */
        }

        @keyframes jump-anim {
            0% { bottom: 0; }
            45% { bottom: 140px; } /* Pula mais alto */
            55% { bottom: 145px; }
            65% { bottom: 140px; }
            100% { bottom: 0; }
        }

        /* O Obstáculo: Texto EPB (Substituindo o Cacto) */
        #cactus {
            position: absolute;
            bottom: 0;
            right: -80px; /* Começa mais fora da tela */
            
            /* Estilização do Texto "EPB" */
            font-size: 32px;
            font-weight: 900;
            color: #c0392b; /* Vermelho escuro */
            letter-spacing: -1px;
            
            /* Garante que a colisão funcione com o texto */
            width: auto;
            height: 40px;
            line-height: 40px;
            text-align: center;
            white-space: nowrap;

            /* Animação Inicial - a duração é controlada pelo JS */
            animation: block-anim 1.5s infinite linear;
        }

        /* Animação do obstáculo */
        @keyframes block-anim {
            0% { right: -80px; }
            100% { right: 780px; } /* Atravessa toda a área do jogo */
        }

        /* Placar e Nível */
        #hud {
            position: absolute;
            top: 15px;
            right: 20px;
            text-align: right;
            color: #333;
            z-index: 5;
        }
        #score-board { font-size: 24px; font-weight: bold; }
        #level-board { font-size: 14px; color: #7f8c8d; }

        /* Tela de Fim de Jogo */
        #game-over {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(231, 76, 60, 0.9); /* Vermelho translúcido */
            color: white;
            text-align: center;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #game-over h2 { margin: 0 0 15px 0; font-size: 40px; }
        #game-over p { font-size: 18px; margin: 0; cursor: pointer; text-decoration: underline;}

        /* Ajustes Mobile */
        @media (max-width: 750px) {
            #game-board { width: 95vw; height: 200px; }
            #player { width: 30px; height: 50px; left: 30px;}
            #cactus { font-size: 26px; height: 30px; line-height: 30px; }
            @keyframes jump-anim {
                0% { bottom: 0; }
                45% { bottom: 110px; }
                100% { bottom: 0; }
            }
        }
    </style>
</head>
<body>

    <div id="game-board">
        <div id="hud">
            <div id="score-board">Pontos: <span id="score">0</span></div>
            <div id="level-board">Nível de Velocidade: <span id="level">1</span></div>
        </div>
        
        <div id="game-over">
            <h2>Pegue o EPB!</h2>
            <p onclick="restartGame()">Voltar para a sala de aula (Clique/Toque)</p>
        </div>
        
        <div id="player"></div>
        
        <div id="cactus">EPB</div>
    </div>

    <script>
        const player = document.getElementById("player");
        const cactus = document.getElementById("cactus");
        const scoreElement = document.getElementById("score");
        const levelElement = document.getElementById("level");
        const gameOverScreen = document.getElementById("game-over");

        let isJumping = false;
        let isGameOver = false;
        let score = 0;
        let scoreInterval;
        
        // --- Configurações de Dificuldade ---
        let currentSpeed = 1.5; // Velocidade inicial (segundos que a animação dura)
        let currentLevel = 1;
        const pointsPerLevel = 500; // A cada 500 pontos, fica mais rápido
        const speedIncrement = 0.15; // Quanto a animação diminui (fica mais rápido) por nível
        const minSpeed = 0.6; // Velocidade máxima (mínimo de segundos)

        function jump() {
            if (isJumping || isGameOver) return;
            isJumping = true;
            player.classList.add("jump");
            setTimeout(() => {
                player.classList.remove("jump");
                isJumping = false;
            }, 500);
        }

        // Controles
        document.addEventListener("keydown", (e) => { if ((e.code === "Space" || e.code === "ArrowUp") && !isGameOver) jump(); });
        document.addEventListener("touchstart", (e) => { if (!isGameOver) jump(); });
        document.addEventListener("mousedown", (e) => { if (!isGameOver) jump(); });

        // Sistema de Pontuação e Dificuldade
        function updateScore() {
            if (!isGameOver) {
                score++;
                scoreElement.innerText = score;

                // Lógica de Dificuldade: Checa se mudou o nível
                let newLevel = Math.floor(score / pointsPerLevel) + 1;
                if (newLevel > currentLevel) {
                    currentLevel = newLevel;
                    levelElement.innerText = currentLevel;
                    increaseSpeed();
                }
            }
        }
        
        // Função que ajusta a velocidade da animação CSS
        function increaseSpeed() {
            if (currentSpeed > minSpeed) {
                currentSpeed -= speedIncrement;
                // Aplica a nova duração da animação diretamente no elemento
                cactus.style.animationDuration = currentSpeed + "s";
                console.log(`Nível ${currentLevel}: Velocidade aumentada para ${currentSpeed.toFixed(2)}s`);
            }
        }

        scoreInterval = setInterval(updateScore, 100);

        // Motor de Colisão
        let gameLoop = setInterval(() => {
            if (isGameOver) return;

            let playerRect = player.getBoundingClientRect();
            let cactusRect = cactus.getBoundingClientRect();

            // Lógica de colisão ajustada para as novas formas
            if (
                playerRect.right > cactusRect.left + 5 && // Pequena margem para o texto "EPB"
                playerRect.left < cactusRect.right - 5 &&
                playerRect.bottom > cactusRect.top
            ) {
                isGameOver = true;
                
                cactus.style.animationPlayState = 'paused';
                player.style.animationPlayState = 'paused';

                gameOverScreen.style.display = "flex";
                clearInterval(scoreInterval);
            }
        }, 10);

        // Reiniciar
        function restartGame() {
            isGameOver = false;
            score = 0;
            currentLevel = 1;
            currentSpeed = 1.5; // Reseta a velocidade inicial

            scoreElement.innerText = score;
            levelElement.innerText = currentLevel;
            gameOverScreen.style.display = "none";
            
            // Retoma e Reseta as animações
            cactus.style.animationPlayState = 'running';
            player.style.animationPlayState = 'running';
            
            cactus.style.animation = 'none';
            cactus.offsetHeight; // Reflow
            // Reaplica a animação com a velocidade inicial resetada
            cactus.style.animation = `block-anim ${currentSpeed}s infinite linear`;

            clearInterval(scoreInterval);
            scoreInterval = setInterval(updateScore, 100);
        }
    </script>
</body>
</html>
