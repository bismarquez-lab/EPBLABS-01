<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Interativo - Upload e Histórico</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        /* --- ESTILOS GERAIS E CANVAS --- */
        body, html { margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0c10; }
        canvas { display: block; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        /* --- PAINEL CENTRAL --- */
        #painel-central {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 15px; padding: 40px; width: 380px; text-align: center; color: white; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* --- LOGIN --- */
        #secao-login h2 { margin-top: 0; font-size: 24px; font-weight: 400; }
        #secao-login p { font-size: 14px; color: #ddd; margin-bottom: 25px; }
        .google-btn-container { display: flex; justify-content: center; }

        /* --- DASHBOARD E UPLOAD --- */
        #secao-dashboard { display: none; }
        #foto-perfil { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #00ff99; margin-bottom: 10px; }
        #nome-usuario { margin: 0 0 5px 0; font-size: 20px; }
        #email-usuario { margin: 0 0 20px 0; font-size: 13px; color: #aaa; }

        input[type="file"] { width: 100%; padding: 10px; margin-bottom: 15px; background: rgba(0,0,0,0.2); border-radius: 8px; color: white; border: 1px solid rgba(255,255,255,0.1); box-sizing: border-box; }
        
        button { width: 100%; padding: 12px; background: linear-gradient(45deg, #00ff99, #00ccff); color: #0b0c10; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 255, 153, 0.4); }
        button:disabled { background: #555; color: #888; cursor: not-allowed; transform: none; box-shadow: none; }

        #mensagem-status { margin-top: 10px; font-size: 14px; min-height: 20px;}

        /* --- LISTA DE ARQUIVOS E BOTÃO APAGAR --- */
        #area-arquivos { margin-top: 20px; text-align: left; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        #area-arquivos h4 { margin: 0 0 10px 0; font-size: 14px; color: #00ff99; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        
        #lista-arquivos { list-style: none; padding: 0; margin: 0; max-height: 120px; overflow-y: auto; font-size: 13px; }
        #lista-arquivos li { margin-bottom: 12px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 5px; }
        #lista-arquivos a { color: #00ccff; text-decoration: none; font-weight: bold; }
        #lista-arquivos a:hover { text-decoration: underline; }
        
        #lista-arquivos::-webkit-scrollbar { width: 6px; }
        #lista-arquivos::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

        .btn-apagar { background: #ff0055; color: white; border: none; border-radius: 4px; padding: 2px 6px; font-size: 10px; cursor: pointer; float: right; margin-top: 2px; width: auto; font-weight: normal; }
        .btn-apagar:hover { background: #cc0044; transform: none; box-shadow: none; }
    </style>
</head>
<body>

    <canvas id="meuCanvas"></canvas>

    <div id="g_id_onload"
         data-client_id="212510825125-n312apg76r8sqbdkf7gcov8da25796ar.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="lidarComRespostaDoGoogle"
         data-auto_prompt="false">
    </div>

    <div id="painel-central">
        
        <div id="secao-login">
            <h2>Portal do Aluno</h2>
            <p>Faça login para acessar o sistema.</p>
            <div class="google-btn-container">
                <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="filled_black" data-text="signin_with" data-size="large"></div>
            </div>
        </div>

        <div id="secao-dashboard">
            <img id="foto-perfil" src="" alt="Sua foto">
            <h3 id="nome-usuario">Nome</h3>
            <p id="email-usuario">email@gmail.com</p>

            <input type="file" id="arquivo-input">
            <button id="btn-enviar" onclick="enviarArquivo()">Enviar Atividade</button>
            <div id="mensagem-status"></div>

            <div id="area-arquivos">
                <h4>Seus Arquivos Enviados</h4>
                <ul id="lista-arquivos">
                    <li style="color: #aaa;">Aguardando login...</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // URL DO SEU GOOGLE APPS SCRIPT
        // ==========================================
        const URL_DO_SCRIPT = 'https://script.google.com/macros/s/AKfycbzRnwoVxl_9ZSFNJJIHKijWFFhfqS1T7US_KGNhCI6qxfeYWsnSoRsHLOcQC5AEwdsi/exec';

        // ==========================================
        // 1. LOGIN DO GOOGLE
        // ==========================================
        function decodificarJwt(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function lidarComRespostaDoGoogle(response) {
            const dadosUsuario = decodificarJwt(response.credential);
            
            document.getElementById('nome-usuario').innerText = "Olá, " + dadosUsuario.given_name;
            document.getElementById('email-usuario').innerText = dadosUsuario.email;
            document.getElementById('foto-perfil').src = dadosUsuario.picture;
            
            document.getElementById('secao-login').style.display = 'none';
            document.getElementById('secao-dashboard').style.display = 'block';

            buscarMeusArquivos(dadosUsuario.email);
        }

        // ==========================================
        // 2. BUSCAR ARQUIVOS E EXIBIR NA LISTA
        // ==========================================
        async function buscarMeusArquivos(email) {
            const listaHtml = document.getElementById('lista-arquivos');
            listaHtml.innerHTML = '<li style="color: #00ccff;">Buscando seus arquivos na nuvem...</li>';

            try {
                const resposta = await fetch(`${URL_DO_SCRIPT}?email=${encodeURIComponent(email)}`);
                const resultado = await resposta.json();

                if (resultado.status === "sucesso") {
                    if (resultado.arquivos.length === 0) {
                        listaHtml.innerHTML = '<li style="color: #aaa;">Você ainda não enviou nenhum arquivo.</li>';
                    } else {
                        listaHtml.innerHTML = ''; 
                        resultado.arquivos.forEach(arq => {
                            listaHtml.innerHTML += `
                                <li>
                                    📄 <a href="${arq.link}" target="_blank">${arq.nome}</a> 
                                    <span style="color:#777; font-size:11px;">(${arq.data})</span>
                                    <button class="btn-apagar" onclick="apagarArquivo('${arq.id}')">🗑️ Apagar</button>
                                </li>
                            `;
                        });
                    }
                } else {
                    listaHtml.innerHTML = `<li style="color: #ff0055;">Erro: ${resultado.mensagem}</li>`;
                }
            } catch (erro) {
                listaHtml.innerHTML = `<li style="color: #ff0055;">Erro ao conectar com o servidor.</li>`;
                console.error(erro);
            }
        }

        // ==========================================
        // 3. APAGAR ARQUIVO
        // ==========================================
        async function apagarArquivo(idDoArquivo) {
            if (!confirm("Tem certeza que deseja apagar este arquivo definitivamente?")) {
                return;
            }

            const emailNaTela = document.getElementById('email-usuario').innerText;
            const statusTexto = document.getElementById('mensagem-status');
            
            statusTexto.innerText = "Apagando arquivo...";
            statusTexto.style.color = "#ffcc00";

            const dadosParaEnviar = {
                action: "delete", 
                fileId: idDoArquivo,
                userEmail: emailNaTela 
            };

            try {
                const resposta = await fetch(URL_DO_SCRIPT, {
                    method: 'POST',
                    body: JSON.stringify(dadosParaEnviar),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' } 
                });

                const resultado = await resposta.json();

                if (resultado.status === "sucesso") {
                    statusTexto.innerText = "✅ Arquivo apagado com sucesso!";
                    statusTexto.style.color = "#00ff99";
                    buscarMeusArquivos(emailNaTela); // Atualiza a lista na tela
                } else {
                    statusTexto.innerText = "❌ Erro ao apagar: " + resultado.mensagem;
                    statusTexto.style.color = "#ff0055";
                }
            } catch (erro) {
                statusTexto.innerText = "❌ Erro de conexão ao tentar apagar.";
                statusTexto.style.color = "#ff0055";
            }
        }

        // ==========================================
        // 4. ENVIAR NOVO ARQUIVO (UPLOAD)
        // ==========================================
        function enviarArquivo() {
            const input = document.getElementById('arquivo-input');
            const statusTexto = document.getElementById('mensagem-status');
            const botao = document.getElementById('btn-enviar');

            if (input.files.length === 0) {
                statusTexto.innerText = "⚠️ Selecione um arquivo.";
                statusTexto.style.color = "#ffcc00";
                return;
            }

            const arquivo = input.files[0];
            const leitor = new FileReader();

            botao.innerText = "Enviando... Aguarde";
            botao.disabled = true;
            statusTexto.innerText = "Preparando arquivo...";
            statusTexto.style.color = "#00ccff";

            leitor.onload = async function(evento) {
                const base64 = evento.target.result.split(',')[1];
                const emailNaTela = document.getElementById('email-usuario').innerText;
                
                const dadosParaEnviar = {
                    action: "upload",
                    fileName: arquivo.name,
                    mimeType: arquivo.type,
                    base64: base64,
                    userEmail: emailNaTela 
                };

                statusTexto.innerText = "Enviando para o Google Drive...";

                try {
                    const resposta = await fetch(URL_DO_SCRIPT, {
                        method: 'POST',
                        body: JSON.stringify(dadosParaEnviar),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' } 
                    });

                    const resultado = await resposta.json();

                    if (resultado.status === "sucesso") {
                        statusTexto.innerText = "✅ Arquivo enviado com sucesso!";
                        statusTexto.style.color = "#00ff99";
                        buscarMeusArquivos(emailNaTela); // Atualiza a lista na tela
                    } else {
                        statusTexto.innerText = "❌ Erro: " + resultado.mensagem;
                        statusTexto.style.color = "#ff0055";
                    }
                } catch (erro) {
                    statusTexto.innerText = "❌ Erro de conexão. Tente novamente.";
                    statusTexto.style.color = "#ff0055";
                }

                botao.innerText = "Enviar Atividade";
                botao.disabled = false;
                input.value = ''; 
            };

            leitor.readAsDataURL(arquivo);
        }

        // ==========================================
        // 5. ANIMAÇÃO DE FUNDO (CANVAS TEIA MAGNÉTICA)
        // ==========================================
        const canvas = document.getElementById('meuCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];
        const cores = ['#ff0055', '#00ff99', '#00ccff', '#ffcc00', '#aa00ff'];
        let hueFundo = 0;
        let mouse = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('touchmove', (e) => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; });
        window.addEventListener('mouseout', () => { mouse.x = undefined; mouse.y = undefined; });
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; initCanvas(); });

        class Particle {
            constructor(x, y, direcaoX, direcaoY, tamanho, cor) {
                this.x = x; this.y = y; this.direcaoX = direcaoX; this.direcaoY = direcaoY;
                this.tamanho = tamanho; this.cor = cor;
            }
            desenhar() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.tamanho, 0, Math.PI * 2, false);
                ctx.fillStyle = this.cor; ctx.fill();
            }
            atualizar() {
                if (this.x > canvas.width || this.x < 0) this.direcaoX = -this.direcaoX;
                if (this.y > canvas.height || this.y < 0) this.direcaoY = -this.direcaoY;

                let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                let distancia = Math.sqrt(dx * dx + dy * dy);
                
                if (distancia < mouse.radius) {
                    const forcaMaxima = (mouse.radius - distancia) / mouse.radius;
                    this.x -= (dx / distancia) * forcaMaxima * 5;
                    this.y -= (dy / distancia) * forcaMaxima * 5;
                } else {
                    this.x += this.direcaoX; this.y += this.direcaoY;
                }
                this.desenhar();
            }
        }

        function initCanvas() {
            particlesArray = [];
            let numeroDeParticulas = (canvas.height * canvas.width) / 9000;
            for (let i = 0; i < numeroDeParticulas; i++) {
                let tamanho = (Math.random() * 2) + 1;
                let x = Math.random() * innerWidth; let y = Math.random() * innerHeight;
                let direcaoX = (Math.random() * 1.5) - 0.75; let direcaoY = (Math.random() * 1.5) - 0.75;
                let cor = cores[Math.floor(Math.random() * cores.length)];
                particlesArray.push(new Particle(x, y, direcaoX, direcaoY, tamanho, cor));
            }
        }

        function conectar() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distancia = ((particlesArray[a].x - particlesArray[b].x) ** 2) + ((particlesArray[a].y - particlesArray[b].y) ** 2);
                    if (distancia < 12000) {
                        let opacidade = 1 - (distancia / 12000);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${opacidade * 0.2})`; 
                        ctx.lineWidth = 1; ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y); ctx.stroke();
                    }
                }
            }
        }

        function animar() {
            requestAnimationFrame(animar);
            ctx.clearRect(0, 0, innerWidth, innerHeight);
            
            hueFundo += 0.05; 
            document.body.style.backgroundColor = `hsl(${hueFundo}, 40%, 8%)`;

            for (let i = 0; i < particlesArray.length; i++) particlesArray[i].atualizar();
            conectar();
        }

        initCanvas();
        animar();
    </script>
</body>
</html>
