<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login com Google</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f2f5;
        }
        #perfil-usuario {
            display: none;
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        #perfil-usuario img {
            border-radius: 50%;
            width: 80px;
        }
    </style>
</head>
<body>

    <h2>Entre na sua conta</h2>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <div id="g_id_onload"
         data-client_id="212510825125-n312apg76r8sqbdkf7gcov8da25796ar.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="lidarComRespostaDoGoogle"
         data-auto_prompt="false">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-shape="rectangular"
         data-theme="outline"
         data-text="signin_with"
         data-size="large"
         data-logo_alignment="left">
    </div>

    <div id="perfil-usuario">
        <img id="foto" src="" alt="Foto de Perfil">
        <h3 id="nome"></h3>
        <p id="email"></p>
    </div>

    <script>
        // Função para decodificar o token de segurança que o Google envia
        function decodificarJwt(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // Função que é chamada automaticamente quando o usuário faz login com sucesso
        function lidarComRespostaDoGoogle(response) {
            // Decodifica a resposta do Google para pegar os dados do usuário
            const dadosUsuario = decodificarJwt(response.credential);

            console.log("Login feito com sucesso!");
            console.log(dadosUsuario);

            // Esconde o botão do Google
            document.querySelector('.g_id_signin').style.display = 'none';

            // Preenche os dados do usuário na tela
            document.getElementById('nome').innerText = "Olá, " + dadosUsuario.name;
            document.getElementById('email').innerText = dadosUsuario.email;
            document.getElementById('foto').src = dadosUsuario.picture;
            
            // Mostra o perfil na tela
            document.getElementById('perfil-usuario').style.display = 'block';
            <div id="area-upload" style="margin-top: 30px; text-align: center; font-family: sans-serif; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <h3>Enviar um arquivo para o sistema</h3>
    
    <input type="file" id="arquivo-input" style="margin-bottom: 15px;">
    <br>
    <button id="btn-enviar" onclick="enviarArquivo()" style="padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
        Enviar Arquivo
    </button>
    
    <p id="mensagem-status" style="color: #666; margin-top: 15px;"></p>
</div>

<script>
    // COLE AQUI O LINK DO GOOGLE APPS SCRIPT QUE VOCÊ COPIOU NO PASSO 2
    const URL_DO_SCRIPT = 'https://script.google.com/macros/s/AKfycbzRnwoVxl_9ZSFNJJIHKijWFFhfqS1T7US_KGNhCI6qxfeYWsnSoRsHLOcQC5AEwdsi/exec';

    function enviarArquivo() {
        const input = document.getElementById('arquivo-input');
        const statusTexto = document.getElementById('mensagem-status');
        const botao = document.getElementById('btn-enviar');

        if (input.files.length === 0) {
            statusTexto.innerText = "Por favor, selecione um arquivo primeiro.";
            statusTexto.style.color = "red";
            return;
        }

        const arquivo = input.files[0];
        const leitor = new FileReader();

        // Mostra que está carregando
        botao.innerText = "Enviando... Aguarde";
        botao.disabled = true;
        statusTexto.innerText = "Preparando arquivo...";
        statusTexto.style.color = "blue";

        // Quando o navegador terminar de ler o arquivo:
        leitor.onload = async function(evento) {
            // Pega o arquivo e transforma num código base64 (texto)
            const base64 = evento.target.result.split(',')[1];
            
            const dadosParaEnviar = {
                fileName: arquivo.name,
                mimeType: arquivo.type,
                base64: base64
            };

            statusTexto.innerText = "Fazendo upload para o Google Drive...";

            try {
                // Envia para o seu Google Apps Script
                const resposta = await fetch(URL_DO_SCRIPT, {
                    method: 'POST',
                    body: JSON.stringify(dadosParaEnviar),
                    // Usamos text/plain para evitar bloqueios de CORS do navegador
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' } 
                });

                const resultado = await resposta.json();

                if (resultado.status === "sucesso") {
                    statusTexto.innerText = "✅ Arquivo enviado com sucesso!";
                    statusTexto.style.color = "green";
                } else {
                    statusTexto.innerText = "❌ Erro ao enviar: " + resultado.mensagem;
                    statusTexto.style.color = "red";
                }
            } catch (erro) {
                statusTexto.innerText = "❌ Erro de conexão ao enviar o arquivo.";
                statusTexto.style.color = "red";
                console.error(erro);
            }

            // Volta o botão ao normal
            botao.innerText = "Enviar Arquivo";
            botao.disabled = false;
            input.value = ''; // Limpa o campo
        };

        // Começa a ler o arquivo
        leitor.readAsDataURL(arquivo);
    }
</script>
            // Aqui você poderia salvar o e-mail no seu banco de dados ou liberar o jogo!
        }
    </script>

</body>
</html>
